name = "smartwallet"
main = "src/index.ts"
compatibility_date = "2025-05-05"

# Tägliche Materialization wiederkehrender Zahlungen (03:00 UTC).
# Lokal testen: npm run dev -- --test-scheduled, dann /__scheduled?cron=0+3+*+*+* aufrufen
[triggers]
crons = ["0 3 * * *"]

# Statische Assets (precompiliertes CSS, PWA-Manifest, Icons, Service Worker).
# Dateien aus ./public werden vor den Worker-Routen ausgeliefert.
# run_worker_first schützt API- und Seitenrouten davor, durch zukünftige
# Dateien unter public/ überschattet zu werden.
[assets]
directory = "./public"
html_handling = "none"
run_worker_first = ["/api/*", "/", "/login", "/register", "/settings", "/dashboard", "/dashboard/*", "/stats"]

# D1-Bindung. WICHTIG: Der Bindungsname muss exakt "DB" bleiben – der Code
# liest c.env.DB. Nur die database_id ersetzen, nichts umbenennen!
[[d1_databases]]
binding = "DB"
database_name = "smartwallet-db"
database_id = "3779d492-7f62-4fcd-b1ff-a1a6d0f2434d"

[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"

